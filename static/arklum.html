<body class="theme-dark">
  <div id="connecting-overlay">
    <div class="ld-scan"></div>
    <div class="ld-scene">
      <div class="ld-tilt">
        <div class="ld-halo"></div>
        <div class="ld-flare"></div>
        <div class="ld-pool"></div>
        <div class="ld-sway">
          <div class="ld-float">
            <svg class="ld-mark" viewBox="0 0 256 440" aria-hidden="true">
              <defs>
                <mask id="ld-sil" maskUnits="userSpaceOnUse">
                  <polygon fill="#fff" points="128,0 0,236.6 128,160"/>
                  <polygon fill="#fff" points="128,0 128,160 256,236.6"/>
                  <polygon fill="#fff" points="0,236.6 128,312 128,160"/>
                  <polygon fill="#fff" points="128,160 128,312 256,236.6"/>
                  <polygon fill="#fff" points="0,258 128,438 128,333.5"/>
                  <polygon fill="#fff" points="128,333.5 128,438 256,258"/>
                </mask>
                <linearGradient id="ld-gr" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                  <stop offset=".5" stop-color="#fff" stop-opacity="1"/>
                  <stop offset="1" stop-color="#fff" stop-opacity="0"/>
                </linearGradient>
              </defs>
              <g>
                <polygon class="p ld-tl" points="128,0 0,236.6 128,160"/>
                <polygon class="p ld-tr" points="128,0 128,160 256,236.6"/>
                <polygon class="p ld-ml" points="0,236.6 128,312 128,160"/>
                <polygon class="p ld-mr" points="128,160 128,312 256,236.6"/>
              </g>
              <g class="ld-gbot">
                <polygon class="p ld-bl" points="0,258 128,438 128,333.5"/>
                <polygon class="p ld-br" points="128,333.5 128,438 256,258"/>
              </g>
              <g mask="url(#ld-sil)" opacity=".9">
                <rect class="ld-sheen" x="-160" y="-40" width="140" height="520" fill="url(#ld-gr)" style="mix-blend-mode:overlay"/>
              </g>
            </svg>
          </div>
          <div class="ld-reflection">
            <div class="ld-flip">
              <svg class="ld-mark" viewBox="0 0 256 440" aria-hidden="true">
                <defs>
                  <mask id="ld-sil2" maskUnits="userSpaceOnUse">
                    <polygon fill="#fff" points="128,0 0,236.6 128,160"/>
                    <polygon fill="#fff" points="128,0 128,160 256,236.6"/>
                    <polygon fill="#fff" points="0,236.6 128,312 128,160"/>
                    <polygon fill="#fff" points="128,160 128,312 256,236.6"/>
                    <polygon fill="#fff" points="0,258 128,438 128,333.5"/>
                    <polygon fill="#fff" points="128,333.5 128,438 256,258"/>
                  </mask>
                  <linearGradient id="ld-gr2" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                    <stop offset=".5" stop-color="#fff" stop-opacity="1"/>
                    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                <g>
                  <polygon class="p ld-tl" points="128,0 0,236.6 128,160"/>
                  <polygon class="p ld-tr" points="128,0 128,160 256,236.6"/>
                  <polygon class="p ld-ml" points="0,236.6 128,312 128,160"/>
                  <polygon class="p ld-mr" points="128,160 128,312 256,236.6"/>
                </g>
                <g class="ld-gbot">
                  <polygon class="p ld-bl" points="0,258 128,438 128,333.5"/>
                  <polygon class="p ld-br" points="128,333.5 128,438 256,258"/>
                </g>
                <g mask="url(#ld-sil2)" opacity=".9">
                  <rect class="ld-sheen" x="-160" y="-40" width="140" height="520" fill="url(#ld-gr2)" style="mix-blend-mode:overlay"/>
                </g>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="boot-phase">Connecting</div>
  </div>
  <aside id="ns-server-rail"></aside>
  <aside id="ns-rail"></aside>
  <main id="ns-main">
    <div id="ns-topbar">
      <img id="headerLeftImgSlot" alt="" style="display:none;">
      <div id="ns-title" class="ns-title"></div>
      <div id="ns-actions" class="ns-actions"></div>
      <img id="headerRightImgSlot" alt="" style="display:none;">
    </div>
    <div id="page-root"></div>
  </main>
  <nav id="ns-dock"></nav>
  <div id="ns-sheet"></div>
  <div id="ns-sheet-backdrop"></div>
  <div id="msg-popup" class="msg-popup"></div> 
  <div id="mention-popup" class="mention-popup"></div>

  <script src="/pages/plugins.js"></script>
  <script src="/pages/404.js"></script>
</body>
